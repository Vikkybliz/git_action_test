name: iOS Screenshots

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    

jobs:
  screenshots:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install project dependecies
        run: flutter pub get

      - name: Build ios app
        run: flutter build ios --simulator --debug  

      - name: List available --simulator
        run: xcrun simctl list devices available

      - name: Boot iOS --simulator
        run: |
          DEVICE_UID = "6F69910C-E4FA-488A-B9C2-41B770484810"
          echo "Using simulator: $DEVICE_UID"
          echo "DEVICE_UID=$DEVICE_UID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_UID" || true
          xcrun simctl bookstatus "$DEVICE_UID" -b

      - name: Find app bundle identifier   
        run: |
          APP_PATH = "build/ios/iphonesimulator/Runner.app"
          BUNDLE_ID =$(
          /usr/libexec/PlistBuddy \
            -c "Print:CFBundleIdentifier" \
            "$APP_PATH/Info.plist"
          )
          echo "Bundle ID: $BUNDLE_ID"
          echo "BUNDLE_ID = $BUNDLE_ID" >> "$GITHUB_ENV"
